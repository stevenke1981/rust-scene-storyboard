name: Release

# Push a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`) to build
# optimised binaries for Linux / Windows / macOS and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: rust-scene-storyboard

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
            run: true
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
            run: true
          - label: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
            run: true
          - label: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
            run: false # cross-compiled on Apple silicon
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux GUI / build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (release profile)
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Headless export smoke test
        if: matrix.run
        shell: bash
        run: |
          B=target/${{ matrix.target }}/release/$BIN
          "$B" --export examples/sample_project.json smoke --no-subdir
          for f in shot_01_shot_1.png storyboard_overview.png storyboard.md storyboard.html project.json; do
            test -s "smoke/$f" || { echo "missing $f"; exit 1; }
          done

      - name: Package
        id: pkg
        shell: bash
        run: |
          NAME="$BIN-${GITHUB_REF_NAME}-${{ matrix.label }}"
          [ "$GITHUB_REF_TYPE" = tag ] || NAME="$BIN-${GITHUB_SHA::7}-${{ matrix.label }}"
          mkdir -p "dist/$NAME/examples"
          EXE=""; [ "$RUNNER_OS" = Windows ] && EXE=".exe"
          cp "target/${{ matrix.target }}/release/$BIN$EXE" "dist/$NAME/"
          cp README.md LICENSE "dist/$NAME/"
          cp assets/fonts/LICENSE-OFL.txt "dist/$NAME/LICENSE-NotoSansCJK-OFL.txt"
          cp examples/sample_project.json "dist/$NAME/examples/"
          cd dist
          if [ "${{ matrix.archive }}" = zip ]; then
            7z a -tzip -mx=9 "$NAME.zip" "$NAME" > /dev/null
            FILE="$NAME.zip"
          else
            tar -czf "$NAME.tar.gz" "$NAME"
            FILE="$NAME.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then sha256sum "$FILE" > "$FILE.sha256"; else shasum -a 256 "$FILE" > "$FILE.sha256"; fi
          ls -la
          echo "file=dist/$FILE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            ${{ steps.pkg.outputs.file }}
            ${{ steps.pkg.outputs.file }}.sha256

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          name: rust-scene-storyboard ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
