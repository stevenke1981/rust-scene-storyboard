name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build & test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux GUI / build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libgl1-mesa-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Headless export smoke test
        run: |
          B=target/release/rust-scene-storyboard
          $B --version
          D=$($B --export examples/sample_project.json out | head -n1)
          echo "exported to $D"
          ls -la "$D"
          for f in shot_01_shot_1.png shot_02_shot_2.png shot_03_shot_3.png storyboard_overview.png storyboard.md storyboard.html project.json; do
            test -s "$D/$f" || { echo "missing $f"; exit 1; }
          done
          grep -q 'data:image/png;base64,' "$D/storyboard.html"
          grep -q '人物與走位' "$D/storyboard.md"

      - uses: actions/upload-artifact@v7
        with:
          name: sample-export
          path: out/
